<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>AD-11 Uso de Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet" type="text/css" />

</head>

<body>

  <div class="container-fluid">
    <button type="button" class="btn btn-primary">Guardar</button>
    <button type="button" class="btn btn-danger">Eliminar</button>
    <button type="button" class="btn btn-success">Enviar</button>

    <p class="text-start">Izquierda</p>
    <p class="text-center text-danger">Centro</p>
    <p class="text-end">Derecha</p>

    <div class="card" style="width: 18rem;">

      <div class="card-header">Hoja de ruta</div>

      <img src="canasta.jpg" class="card-img-top" alt="Canasta de frutas">

      <ul class="list-group list-group-flush">
        <li class="list-group-item">uvas</li>
        <li class="list-group-item">fresas</li>
        <li class="list-group-item">moras</li>
      </ul>

    </div>

  </div>


  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
